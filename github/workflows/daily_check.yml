name: The Jackal AI Bot - Controllo Giornaliero

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa le librerie necessarie
        run: pip install yfinance feedparser requests

      - name: Esegui il controllo giornaliero del bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mega_paper_trading_github.py

      - name: Salva lo stato aggiornato nel repository
        run: |
          git config user.name "The Jackal AI Bot"
          git config user.email "bot@thejackalai.local"
          git add paper_state.json paper_equity_log.csv paper_decision_log.csv
          git commit -m "Aggiornamento automatico stato bot $(date -u +'%Y-%m-%d')" || echo "Nessuna modifica da salvare"
          git push
