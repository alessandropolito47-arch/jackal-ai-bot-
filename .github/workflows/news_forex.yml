name: Rassegna forex

on:
  schedule:
    - cron: "15 6 * * 1-5"   # lunedi'-venerdi' alle 06:15 UTC (08:15 ora italiana legale, 07:15 solare)
  workflow_dispatch:          # avvio manuale dalla scheda Azioni

jobs:
  rassegna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dipendenze
        run: pip install requests
      - name: Invia la rassegna forex su Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python news_forex.py
