name: The Jackal AI Bot - Riepilogo Mensile

on:
  schedule:
    - cron: '0 21 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monthly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa le librerie necessarie
        run: pip install requests

      - name: Genera il riepilogo mensile
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python periodic_report.py monthly
